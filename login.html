 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRP Engine Portal - Sign In</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(rgba(10, 20, 35, 0.65), rgba(10, 20, 35, 0.75)), 
                        url('https://images.unsplash.com/photo-1581091226825-a6a2a5aee158?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            overflow: hidden;
        }

        /* Centered Glassmorphism Login Card */
        .login-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 36px;
            background: rgba(22, 33, 52, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            color: #ffffff;
        }

        /* Header / Brand Title */
        .brand-header {
            margin-bottom: 30px;
        }

        .brand-header h1 {
            font-size: 1.85rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        .brand-header p {
            font-size: 0.85rem;
            color: #94a3b8;
            margin-top: 8px;
        }

        /* Form Inputs */
        .form-group {
            text-align: left;
            margin-bottom: 22px;
        }

        .form-group label {
            display: block;
            font-size: 0.88rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            background: rgba(15, 23, 42, 0.6);
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .form-group input:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25);
            background: rgba(15, 23, 42, 0.8);
        }

        /* Bright Cyan Sign-In Button */
        .btn-submit {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #38bdf8, #00f2fe);
            color: #0f172a;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 242, 254, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 20px rgba(0, 242, 254, 0.45);
            filter: brightness(1.05);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Footer Link */
        .login-footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        .login-footer a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
            margin-left: 4px;
            transition: color 0.2s ease;
        }

        .login-footer a:hover {
            color: #00f2fe;
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Brand Header -->
        <div class="brand-header">
            <h1>⚙️ MRP Engine Portal</h1>
            <p>Sign in to access your manufacturing workspace</p>
        </div>

        <!-- Login Form -->
        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    placeholder="test@admin.com" 
                    value="test@admin.com" 
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    placeholder="••••••••••••" 
                    value="password123" 
                    required
                >
            </div>

            <button type="submit" class="btn-submit">Sign In</button>
        </form>

        <!-- Footer -->
        <div class="login-footer">
            New to the platform? <a href="#">Create an account</a>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            alert(`Signing in as: ${email}`);
            // Redirect to dashboard page
            // window.location.href = "dashboard.html";
        }
    </script>
</body>
</html>
